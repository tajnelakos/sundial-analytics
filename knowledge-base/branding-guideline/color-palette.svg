<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', 'Courier New', monospace">
  <rect x="0" y="0" width="760" height="360" fill="#FCFCFB"/>

  <!-- Row 1: Primary / Secondary / Neutral dark / Neutral mid -->
  <text x="24" y="28" font-size="13" fill="#5B6470" letter-spacing="1">PRIMARY</text>
  <rect x="24" y="40" width="150" height="90" fill="#1A3A5C"/>
  <text x="24" y="148" font-size="14" fill="#1C1C1A" font-weight="700">Sundial Navy</text>
  <text x="24" y="166" font-size="12" fill="#5B6470">#1A3A5C</text>

  <text x="204" y="28" font-size="13" fill="#5B6470" letter-spacing="1">SECONDARY</text>
  <rect x="204" y="40" width="150" height="90" fill="#C1892E"/>
  <text x="204" y="148" font-size="14" fill="#1C1C1A" font-weight="700">Meridian Gold</text>
  <text x="204" y="166" font-size="12" fill="#5B6470">#C1892E</text>

  <text x="384" y="28" font-size="13" fill="#5B6470" letter-spacing="1">NEUTRAL — INK</text>
  <rect x="384" y="40" width="150" height="90" fill="#1C1C1A"/>
  <text x="384" y="148" font-size="14" fill="#1C1C1A" font-weight="700">Ink</text>
  <text x="384" y="166" font-size="12" fill="#5B6470">#1C1C1A</text>

  <text x="564" y="28" font-size="13" fill="#5B6470" letter-spacing="1">NEUTRAL — MID</text>
  <rect x="564" y="40" width="150" height="90" fill="#8A8782" stroke="#E1E0D9"/>
  <text x="564" y="148" font-size="14" fill="#1C1C1A" font-weight="700">Slate</text>
  <text x="564" y="166" font-size="12" fill="#5B6470">#8A8782</text>

  <!-- Row 2: Paper / Status good / warning / critical -->
  <text x="24" y="208" font-size="13" fill="#5B6470" letter-spacing="1">NEUTRAL — PAPER</text>
  <rect x="24" y="220" width="150" height="90" fill="#F4F3EF" stroke="#E1E0D9"/>
  <text x="24" y="328" font-size="14" fill="#1C1C1A" font-weight="700">Paper</text>
  <text x="24" y="346" font-size="12" fill="#5B6470">#F4F3EF</text>

  <text x="204" y="208" font-size="13" fill="#5B6470" letter-spacing="1">STATUS — GOOD</text>
  <rect x="204" y="220" width="150" height="90" fill="#0CA30C"/>
  <text x="204" y="328" font-size="14" fill="#1C1C1A" font-weight="700">Good</text>
  <text x="204" y="346" font-size="12" fill="#5B6470">#0CA30C</text>

  <text x="384" y="208" font-size="13" fill="#5B6470" letter-spacing="1">STATUS — WARNING</text>
  <rect x="384" y="220" width="150" height="90" fill="#D68A1F"/>
  <text x="384" y="328" font-size="14" fill="#1C1C1A" font-weight="700">Warning</text>
  <text x="384" y="346" font-size="12" fill="#5B6470">#D68A1F</text>

  <text x="564" y="208" font-size="13" fill="#5B6470" letter-spacing="1">STATUS — CRITICAL</text>
  <rect x="564" y="220" width="150" height="90" fill="#D03B3B"/>
  <text x="564" y="328" font-size="14" fill="#1C1C1A" font-weight="700">Critical</text>
  <text x="564" y="346" font-size="12" fill="#5B6470">#D03B3B</text>
</svg>
