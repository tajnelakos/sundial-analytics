<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#FCFCFB"/>

  <!-- Clear space -->
  <text x="24" y="30" font-size="15" font-weight="700" fill="#1C1C1A">Clear space</text>
  <text x="24" y="50" font-size="12" fill="#5B6470">Minimum clear space on every side equals the height of the mark (x).</text>
  <rect x="24" y="65" width="260" height="140" fill="none" stroke="#C7CDD3" stroke-dasharray="4 4"/>
  <g transform="translate(94,95)">
    <path d="M 20 60 A 22 22 0 0 1 64 60" fill="none" stroke="#C1892E" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="42,15 25,60 59,60" fill="#1A3A5C"/>
    <circle cx="42" cy="10" r="4" fill="#C1892E"/>
  </g>
  <path d="M 94 65 L 94 205 M 154 65 L 154 205" stroke="#E1E0D9" stroke-width="1"/>

  <!-- Minimum size -->
  <text x="320" y="30" font-size="15" font-weight="700" fill="#1C1C1A">Minimum size</text>
  <text x="320" y="50" font-size="12" fill="#5B6470">24px (digital) / 10mm (print) for the mark alone.</text>
  <g transform="translate(340,120)">
    <path d="M 6 20 A 7.5 7.5 0 0 1 21 20" fill="none" stroke="#C1892E" stroke-width="1.4" stroke-linecap="round"/>
    <polygon points="13.5,5 8,20 19,20" fill="#1A3A5C"/>
    <circle cx="13.5" cy="3.5" r="1.4" fill="#C1892E"/>
  </g>
  <text x="380" y="140" font-size="11" fill="#8A8782">24px</text>
  <g transform="translate(430,90)">
    <path d="M 12 40 A 15 15 0 0 1 42 40" fill="none" stroke="#C1892E" stroke-width="2.8" stroke-linecap="round"/>
    <polygon points="27,10 17,40 37,40" fill="#1A3A5C"/>
    <circle cx="27" cy="7" r="2.8" fill="#C1892E"/>
  </g>
  <text x="500" y="140" font-size="11" fill="#8A8782">48px</text>

  <!-- On dark -->
  <text x="640" y="30" font-size="15" font-weight="700" fill="#1C1C1A">On dark surfaces</text>
  <text x="640" y="50" font-size="12" fill="#5B6470">Use logo-reversed.svg — never the primary mark at reduced opacity.</text>
  <rect x="640" y="65" width="220" height="100" fill="#16324A"/>
  <g transform="translate(695,90)">
    <path d="M 15 45 A 17 17 0 0 1 49 45" fill="none" stroke="#D9A54B" stroke-width="3" stroke-linecap="round"/>
    <polygon points="32,10 20,45 44,45" fill="#FFFFFF"/>
    <circle cx="32" cy="7" r="3" fill="#D9A54B"/>
  </g>

  <!-- Don't examples -->
  <text x="24" y="250" font-size="15" font-weight="700" fill="#D03B3B">Don't</text>

  <text x="24" y="280" font-size="12" fill="#5B6470">Stretch or distort proportions</text>
  <rect x="24" y="292" width="260" height="120" fill="#FFFFFF" stroke="#E1E0D9"/>
  <g transform="translate(90,320) scale(2.6,1)">
    <path d="M 20 60 A 22 22 0 0 1 64 60" fill="none" stroke="#C1892E" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="42,15 25,60 59,60" fill="#1A3A5C"/>
    <circle cx="42" cy="10" r="4" fill="#C1892E"/>
  </g>

  <text x="320" y="280" font-size="12" fill="#5B6470">Recolor outside the palette</text>
  <rect x="320" y="292" width="260" height="120" fill="#FFFFFF" stroke="#E1E0D9"/>
  <g transform="translate(390,322)">
    <path d="M 20 60 A 22 22 0 0 1 64 60" fill="none" stroke="#E354C9" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="42,15 25,60 59,60" fill="#22C55E"/>
    <circle cx="42" cy="10" r="4" fill="#E354C9"/>
  </g>

  <text x="616" y="280" font-size="12" fill="#5B6470">Place on a busy, low-contrast background</text>
  <rect x="616" y="292" width="260" height="120" fill="#8A8782"/>
  <circle cx="660" cy="320" r="18" fill="#7C8582"/>
  <circle cx="820" cy="380" r="24" fill="#98A0A3"/>
  <rect x="700" y="340" width="60" height="60" fill="#6B7472"/>
  <g transform="translate(686,322)">
    <path d="M 20 60 A 22 22 0 0 1 64 60" fill="none" stroke="#C1892E" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
    <polygon points="42,15 25,60 59,60" fill="#1A3A5C" opacity="0.85"/>
    <circle cx="42" cy="10" r="4" fill="#C1892E" opacity="0.85"/>
  </g>

  <text x="24" y="450" font-size="12" fill="#5B6470">Add a drop shadow, outline, or other effect</text>
  <rect x="24" y="462" width="260" height="90" fill="#FFFFFF" stroke="#E1E0D9"/>
  <g transform="translate(90,478)" filter="url(#ds)">
    <path d="M 20 60 A 22 22 0 0 1 64 60" fill="none" stroke="#C1892E" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="42,15 25,60 59,60" fill="#1A3A5C"/>
    <circle cx="42" cy="10" r="4" fill="#C1892E"/>
  </g>
  <defs>
    <filter id="ds" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="4" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <text x="320" y="450" font-size="12" fill="#5B6470">Rebuild the wordmark in another typeface</text>
  <rect x="320" y="462" width="260" height="90" fill="#FFFFFF" stroke="#E1E0D9"/>
  <text x="350" y="518" font-size="30" font-family="Georgia, serif" font-style="italic" fill="#1A3A5C">Sundial</text>

  <text x="616" y="450" font-size="12" fill="#5B6470">Separate the mark from the wordmark arbitrarily</text>
  <rect x="616" y="462" width="260" height="90" fill="#FFFFFF" stroke="#E1E0D9"/>
  <g transform="translate(636,478)">
    <path d="M 20 60 A 22 22 0 0 1 64 60" fill="none" stroke="#C1892E" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="42,15 25,60 59,60" fill="#1A3A5C"/>
    <circle cx="42" cy="10" r="4" fill="#C1892E"/>
  </g>
  <text x="820" y="518" font-size="20" font-weight="700" fill="#1A3A5C">Sundial</text>
</svg>
